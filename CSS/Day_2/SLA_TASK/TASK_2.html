<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Company Details</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            scroll-behavior: smooth;
        }
        body{
            font-family: Arial, sans-serif;
             background-color: white;
             text-align: center;
        }
        h1{
            color: blue;
        }
        .company{
            width: 300px;
            height: 150px;
            margin:30px auto;
            padding: 15px;
            color: white;
            border-radius: 10px;
        }
        h1,p{
            margin: 10px;
            padding: 10px;
        }
        #zoho{
            background-color: blueviolet;
        }
        #tcs{
            background-color: brown;
        }
        #infosys{
            background-color: chartreuse;
        }
    </style>
</head>

<body>
    <h1>IT Company Details</h1>

    <div class="company" id="zoho">
        <h2>Zoho</h2>
        <p>Zoho develops cloud-based business software and applications.</p>
    </div>

    <div class="company" id="tcs">
        <h2>TCS</h2>
        <p>Tata Consultancy Services is a leading IT services company.</p>
    </div>

    <div class="company" id="infosys">
        <h2>Infosys</h2>
        <p>Infosys provides IT consulting and software development services.</p>
    </div>
</body>
</html>

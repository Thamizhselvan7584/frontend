<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After Example</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h2{
            color: navy;
            margin: 15px;
        }

        h2::before{
            content: "★ ";
            color: red;
        }

        h2::after{
            content: " ✔";
            color: green;
        }
    </style>
</head>
<body>
<div>
    <h2>HTML</h2>
    <h2>CSS</h2>
    <h2>JavaScript</h2>
    <h2>React</h2>
    <h2>Node.js</h2>
</div>
</body>
</html>

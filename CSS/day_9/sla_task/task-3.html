<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Lift Effect</title>
    <link rel="stylesheet" href="assets/stylesheet/style.css">
</head>

<body>
    <div class="headone">
        <h2>Product Cards</h2>
    </div>

    <div class="products">

        <div class="card">
            <img src="https://picsum.photos/250/180?random=1" alt="Laptop">
            <h3>Laptop</h3>
            <p class="price">₹45,000</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=2" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹2,999</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=3" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹5,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/180?random=4" alt="Camera">
            <h3>Camera</h3>
            <p class="price">₹28,999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>

</html>

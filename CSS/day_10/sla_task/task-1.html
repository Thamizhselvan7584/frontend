<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 30%;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
            transition: .4s;
        }
        .card:hover{
            transform: scale(1.1);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card h2 {
            margin: 15px 0 10px;
        }

        .card p {
            margin: 8px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .card {
                width: 45%;

            }
        }

        /* Mobile */
        @media (max-width: 576px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>Student Profiles</h1>

    <div class="container">

        <div class="card">
            <img src="assets/img/emp1.jpg" alt="Student">
            <h2>Arun Kumar</h2>
            <p>Course: BCA</p>
            <p>Mobile: 9876543210</p>
        </div>

        <div class="card">
            <img src="assets/img/emp2.jpg" alt="Student">
            <h2>Priya</h2>
            <p>Course: B.Sc CS</p>
            <p>Mobile: 9876543211</p>
        </div>

        <div class="card">
            <img src="assets/img/emp3.jpg" alt="Student">
            <h2>Rahul</h2>
            <p>Course: BCA</p>
            <p>Mobile: 9876543212</p>
        </div>

        <div class="card">
            <img src="assets/img/emp4.jpg" alt="Student">
            <h2>Divya</h2>
            <p>Course: B.Com</p>
            <p>Mobile: 9876543213</p>
        </div>

        <div class="card">
            <img src="assets/img/Thamizhselvan.jpeg" alt="Student">
            <h2>Karthik</h2>
            <p>Course: B.Sc IT</p>
            <p>Mobile: 9876543214</p>
        </div>

        <div class="card">
            <img src="assets/img/em5.jpg" alt="Student">

        </div>

    </div>

</body>

</html>

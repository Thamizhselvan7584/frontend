<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link rel="stylesheet" href="css/main.css"></head><body><div id="site-nav"></div><main class="section"><div class="container" style="max-width:560px"><div class="card form-card"><div class="eyebrow">Global 2030 Account</div><h1>Reset Password</h1><form id="auth-form" data-mode="forgot"><label>Email<input id="emailVal" type="email" required placeholder=""></label><label>New Password<input id="password" type="password" required minlength="8" placeholder="Enter new password"></label><button type="button" class="btn alt" onclick="togglePass('password',this)">Show</button><label>Confirm Password<input id="confirmPassword" type="password" required minlength="8" placeholder="Confirm new password"></label><button type="button" class="btn alt" onclick="togglePass('confirmPassword',this)">Show</button><button class="btn" type="submit">Update Password</button><p id="msg" class="muted"></p></form></div></div></main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>

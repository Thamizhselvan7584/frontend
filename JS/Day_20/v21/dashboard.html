<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard — Global 2030</title>
    <link rel="icon" type="image/x-icon" href="assets/images/icon-1.jpg">
    <link rel="stylesheet" href="css/main.css">
    <noscript>
        <meta http-equiv="refresh" content="0;url=login.html">
    </noscript>
</head>
<body>
    <div id="site-nav">
    </div>
    <main class="section">
        <div class="container">
            <div class="eyebrow">Personal Dashboard</div>
            <h1 id="welcome">Welcome</h1>
            <div class="grid four">
                <div class="card">
                    <div class="stat" id="reviewCount">0</div>
                    <div class="muted">Your community reviews</div>
                </div>
                <div class="card">
                    <div class="stat" id="suggestionCount">0</div>
                    <div class="muted">Community suggestions</div>
                </div>
                <div class="card">
                    <div class="stat" id="predictionCount">0</div>
                    <div class="muted">Predictions submitted</div>
                </div>
                <div class="card">
                    <div class="stat">2030</div>
                    <div class="muted">Future journey</div>
                </div>
            </div>
            <section class="section">
                <div class="grid">
                    <a class="card" href="pages/it-2030.html">
                        <span class="badge">01</span>
                        <h3>Technology of 2030</h3>
                        <p class="muted">Learn what is changing and why.</p>
                    </a>
                    <a class="card" href="pages/no-it.html">
                        <span class="badge">02</span>
                        <h3>Technology Stopped</h3>
                        <p class="muted">Run the interactive thought experiment.</p>
                    </a>
                    <a class="card" href="pages/future-world.html">
                        <span class="badge">03</span>
                        <h3>Solutions</h3>
                        <p class="muted">Explore ways to build a better future.</p>
                    </a>
                </div>
            </section>
        </div>
    </main>
    <script src="js/app.js">

    </script>
    <script src="js/dashboard.js"></script>

</body>
</html>

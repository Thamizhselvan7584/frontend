<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Global 2030</title><link rel="stylesheet" href="css/main.css"></head><body><div id="site-nav"></div><main class="section"><div class="container" style="max-width:700px"><div class="card form-card"><div class="eyebrow">Account</div><h1>Your Profile</h1><p class="muted">Add a few details so your profile is more complete.</p><form id="profile-form"><label>Name<input id="nameVal" required></label><label>Email<input id="emailVal" disabled></label><label>City<input id="cityVal"></label><div class="profile-grid"><label>Age<input id="ageVal" type="number" min="1" max="120" placeholder="e.g. 20"></label><label>Date of Birth (DOB)<input id="dobVal" type="date"></label></div><label>Education<select id="educationVal"><option value="">Select education level</option><option>School</option><option>Higher Secondary</option><option>Diploma</option><option>Undergraduate</option><option>Postgraduate</option><option>Doctorate</option><option>Other</option></select></label><div class="actions"><button class="btn" type="submit">Save Profile</button></div><p id="msg" class="muted" aria-live="polite"></p></form></div></div></main><script src="js/app.js"></script><script src="js/profile.js"></script></body></html>

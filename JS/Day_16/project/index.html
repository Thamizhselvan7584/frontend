```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }


        .calculator {
            width: 360px;

            padding: 25px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }


        h1 {
            text-align: center;

            margin-bottom: 25px;

            color: #333;
        }


        input {
            width: 100%;

            height: 50px;

            margin-bottom: 15px;

            padding: 10px 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 18px;

            outline: none;
        }


        input:focus {
            border-color: #4f46e5;
        }


        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 5px;
        }


        button {
            height: 55px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #3730a3;

            transform: scale(1.03);
        }


        button:active {
            transform: scale(0.95);
        }


        #result {
            margin-top: 20px;

            background: #f5f5f5;

            font-weight: bold;

            color: #222;
        }

    </style>

</head>


<body>


    <div class="calculator">


        <h1>Basic Calculator</h1>


        <!-- First Number -->

        <input
            type="number"
            id="firstNumber"
            placeholder="Enter First Number"
        >


        <!-- Second Number -->

        <input
            type="number"
            id="secondNumber"
            placeholder="Enter Second Number"
        >


        <!-- Operation Buttons -->

        <div class="buttons">

            <button id="add">+</button>

            <button id="sub">−</button>

            <button id="mul">×</button>

            <button id="div">÷</button>

        </div>


        <!-- Result -->

        <input
            type="text"
            id="result"
            placeholder="Result"
            readonly
        >

    </div>



    <script>


        // Get input elements

        const firstNumber =
            document.getElementById("firstNumber");

        const secondNumber =
            document.getElementById("secondNumber");

        const result =
            document.getElementById("result");


        // Addition

        document
            .getElementById("add")
            .addEventListener("click", function () {

                const num1 =
                    Number(firstNumber.value);

                const num2 =
                    Number(secondNumber.value);

                const answer =
                    num1 + num2;

                result.value =
                    answer;

            });


        // Subtraction

        document
            .getElementById("sub")
            .addEventListener("click", function () {

                const num1 =
                    Number(firstNumber.value);

                const num2 =
                    Number(secondNumber.value);

                const answer =
                    num1 - num2;

                result.value =
                    answer;

            });


        // Multiplication

        document
            .getElementById("mul")
            .addEventListener("click", function () {

                const num1 =
                    Number(firstNumber.value);

                const num2 =
                    Number(secondNumber.value);

                const answer =
                    num1 * num2;

                result.value =
                    answer;

            });


        // Division

        document
            .getElementById("div")
            .addEventListener("click", function () {

                const num1 =
                    Number(firstNumber.value);

                const num2 =
                    Number(secondNumber.value);


                if (num2 === 0) {

                    result.value =
                        "Cannot divide by 0";

                }

                else {

                    const answer =
                        num1 / num2;

                    result.value =
                        answer;

                }

            });


    </script>


</body>

</html>
```

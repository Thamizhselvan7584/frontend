<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Simple Calculator</title>

    <style>

        /* =========================
           BASIC STYLE
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f2f2f2;
        }


        /* =========================
           CALCULATOR
        ========================= */

        .calculator {
            width: 350px;

            padding: 25px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            text-align: center;

            margin-bottom: 20px;

            font-size: 28px;
        }


        /* =========================
           DISPLAY
        ========================= */

        .display {
            width: 100%;

            height: 70px;

            margin-bottom: 20px;

            padding: 15px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            background: #222;

            color: white;

            border-radius: 10px;

            font-size: 32px;

            overflow: hidden;
        }


        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            height: 60px;

            border: none;

            border-radius: 10px;

            background: #eeeeee;

            font-size: 22px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #dddddd;

            transform: scale(1.03);
        }


        /* =========================
           OPERATORS
        ========================= */

        .operator {
            background: #4f46e5;

            color: white;
        }


        .operator:hover {
            background: #3730a3;
        }


        /* =========================
           CLEAR BUTTON
        ========================= */

        .clear {
            background: #ef4444;

            color: white;
        }


        .clear:hover {
            background: #dc2626;
        }


        /* =========================
           EQUAL BUTTON
        ========================= */

        .equal {
            background: #16a34a;

            color: white;
        }


        .equal:hover {
            background: #15803d;
        }

    </style>

</head>


<body>


    <!-- =========================
         CALCULATOR
    ========================= -->

    <div class="calculator">

        <h1>Simple Calculator</h1>


        <!-- Display -->

        <div class="display">
            0
        </div>


        <!-- Buttons -->

        <div class="buttons">

            <!-- Row 1 -->

            <button>7</button>

            <button>8</button>

            <button>9</button>

            <button class="operator">÷</button>


            <!-- Row 2 -->

            <button>4</button>

            <button>5</button>

            <button>6</button>

            <button class="operator">×</button>


            <!-- Row 3 -->

            <button>1</button>

            <button>2</button>

            <button>3</button>

            <button class="operator">−</button>


            <!-- Row 4 -->

            <button>0</button>

            <button class="clear">C</button>

            <button class="equal">=</button>

            <button class="operator">+</button>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        let display =
            document.querySelector(".display");

        let buttons =
            document.querySelectorAll("button");


        let firstNumber = "";

        let secondNumber = "";

        let operator = "";


        buttons.forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    let value =
                        button.innerText;


                    /* =====================
                       CLEAR
                    ===================== */

                    if (value === "C") {

                        firstNumber = "";

                        secondNumber = "";

                        operator = "";

                        display.innerText = "0";

                    }


                    /* =====================
                       OPERATOR
                    ===================== */

                    else if (
                        value === "+" ||
                        value === "−" ||
                        value === "×" ||
                        value === "÷"
                    ) {

                        firstNumber =
                            display.innerText;

                        operator = value;

                        display.innerText = "0";

                    }


                    /* =====================
                       EQUAL
                    ===================== */

                    else if (value === "=") {

                        secondNumber =
                            display.innerText;


                        let num1 =
                            Number(firstNumber);

                        let num2 =
                            Number(secondNumber);


                        let result;


                        /* Addition */

                        if (operator === "+") {

                            result =
                                num1 + num2;

                        }


                        /* Subtraction */

                        else if (operator === "−") {

                            result =
                                num1 - num2;

                        }


                        /* Multiplication */

                        else if (operator === "×") {

                            result =
                                num1 * num2;

                        }


                        /* Division */

                        else if (operator === "÷") {

                            if (num2 === 0) {

                                display.innerText =
                                    "Error";

                                return;

                            }

                            result =
                                num1 / num2;

                        }


                        display.innerText =
                            result;


                        firstNumber = result;

                        secondNumber = "";

                        operator = "";

                    }


                    /* =====================
                       NUMBER
                    ===================== */

                    else {

                        if (
                            display.innerText === "0"
                        ) {

                            display.innerText =
                                value;

                        }

                        else {

                            display.innerText +=
                                value;

                        }

                    }

                }

            );

        });

    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body>
    <center>
    <h2>Contact Form</h2>
    </center>
    <form action="">
        <label for="Enter Full Name">Enter Full Name:</label>
        <input type="text" name="Enter Full Name" placeholder="Enter Full Name" required><br /><br />
        <label for="Email">Enter Email:</label>
        <input type="email" name="email" placeholder="Enter 10-digit Mobile" required><br /><br />
        <label for="Mobile Number">Enter Mobile Number:</label>
        <input type="tel" name="Mobile Number" placeholder="Enter personal Email" required><br /><br />
        <label for="Message">Message:</label><br />
        <textarea name="Message" cols="20" rows="4" placeholder="Enter Message"></textarea><br /><br />
        <label for="Address">Enter Address:</label><br />
        <textarea name="Address" id="" cols="20" rows="4" placeholder="Enter Address"></textarea>
        <br /><br />
        <input type="submit" value="submit">
        <input type="reset" value="Clear">
    </form>

</body>

</html>

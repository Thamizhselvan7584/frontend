<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interactive</title>
</head>
<body>
<details>
    <summary>Click here to view more details</summary>
    <p>This content is hidden until the user clicks the summary text.</p>
</details>
<button type="button">Click Me</button>
<label for="browserInput">Choose a browser:</label>
<input list="browsers" id="browserInput" name="browser">
<datalist id="browsers">
    <option value="Chrome">
    <option value="Firefox">
    <option value="Safari">
    <option value="Edge">
</datalist>

</body>
</html>

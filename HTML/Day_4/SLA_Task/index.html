<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Elements Showcase</title>
</head>
<body>
    <h1>Main Page Heading</h1>
    <p>This is a standard text paragraph that acts as a structural text container on the page.</p>
    <strong>This is bold text.</strong><br><br>
    <em>This is italic text.</em><br><br>
    <mark>This is highlighted text.</mark><br><br>
    <button type="button">Click Me</button><br><br>
    <input type="text" placeholder="Type text here..."><br><br>
    <select>
        <option value="1">Option 1</option>
        <option value="2">Option 2</option>
    </select><br><br>
    <textarea placeholder="Type your long message here..."></textarea>
</body>
</html>
